conditions:
  - name: dse
    command: python -m pyserini.search.faiss --encoder-class dse --encoder Tevatron/dse-phi3-v1.0 --pooling last --index ${index} --topics ${topics} --output $output --hits 20 --device cuda:0 --batch-size 128
    datasets:
      - dataset: wiki-ss-nq
        index: wiki-ss.dse
        topics: wiki-ss-nq
        scores:
          - Top-1: 0.4307
            Top-5: 0.6554
            Top-10: 0.7133
            Top-20: 0.7593
      - dataset: slidevqa
        index: slidevqa.dse
        topics: slidevqa
        scores:
          - nDCG@10: 0.7306
            Recall@10: 0.8317
